<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>BlessedINK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Oswald', sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      height: 100vh;
      background: url('tattoo1.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      top: 0;
      left: 0;
    }

    .hero {
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 3.5rem;
      letter-spacing: 5px;
    }

    p {
      opacity: 0.8;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 30px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .gallery img {
      width: 280px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .fade {
      opacity: 0;
      transform: translateY(40px);
      transition: 0.8s;
    }

    .fade.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      padding: 20px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>
  <div class="hero">
    <h1>BlessedINK</h1>
    <p>No es solo tinta. Es identidad.</p>
    <button class="btn" onclick="scrollToSection()">Ver trabajos</button>
  </div>
</header>

<section class="fade">
  <h2>TRABAJOS</h2>
  <div class="gallery">
    <img src="tattoo1.jpg">
    <img src="tattoo2.jpg">
  </div>
</section>

<section class="fade">
  <h2>SERVICIOS</h2>
  <p>Tatuajes personalizados y perforaciones profesionales en un ambiente seguro.</p>
</section>

<section class="fade">
  <h2>UBICACIÓN</h2>
  <p>Héroes de Tecámac, Estado de México</p>
  <p>Abierto · Cierra a las 8 p.m.</p>
</section>

<section class="fade">
  <h2>CONTACTO</h2>
  <p>WhatsApp: 56 1779 0068</p>
</section>

<footer>
  <p>© 2026 BlessedINK</p>
</footer>

<script>
function scrollToSection() {
  document.querySelector('.gallery').scrollIntoView({
    behavior: 'smooth'
  });
}

const elements = document.querySelectorAll('.fade');

const showOnScroll = () => {
  const triggerBottom = window.innerHeight * 0.85;

  elements.forEach(el => {
    const boxTop = el.getBoundingClientRect().top;

    if (boxTop < triggerBottom) {
      el.classList.add('show');
    }
  });
};

window.addEventListener('scroll', showOnScroll);
showOnScroll();
</script>

</body>
</html>
